[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "format-claim-audit"
version = "0.1.0"
description = "Offline static audit of documented data-format claims in Python projects"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.scripts]
format-claim-audit = "format_claim_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
